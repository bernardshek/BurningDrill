name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter @poker-trainer/pack-format build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @poker-trainer/web exec node scripts/sync-packs.mjs
      - run: pnpm --filter @poker-trainer/web build
        # Intentionally NO solver install — web image stays solver-free
